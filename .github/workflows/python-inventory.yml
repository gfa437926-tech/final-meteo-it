name: Python inventory checks

on:
  push:
    branches: [main]
    paths:
      - "python_app/**"
      - ".github/workflows/python-inventory.yml"
  pull_request:
    paths:
      - "python_app/**"
      - ".github/workflows/python-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r python_app/requirements.txt
      - name: Compile Python modules
        working-directory: python_app
        run: python -m compileall -q .
      - name: Run storage tests
        working-directory: python_app
        run: python -m unittest -v

  windows-exe-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate one-click PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "python_app/install_and_setup.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Install application dependencies
        run: python -m pip install -r python_app/requirements.txt
      - name: Build Windows executable
        working-directory: python_app
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name InventoryManager --collect-all psycopg --collect-all dotenv main.py
      - name: Verify executable output
        shell: pwsh
        run: |
          $exe = "python_app/dist/InventoryManager/InventoryManager.exe"
          if (-not (Test-Path $exe)) { throw "EXE was not produced: $exe" }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload Windows executable build
        uses: actions/upload-artifact@v4
        with:
          name: InventoryManager-Windows-x64
          path: python_app/dist/InventoryManager/
          if-no-files-found: error
          retention-days: 14
