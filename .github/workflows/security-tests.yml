name: Inventory security tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    name: Provisioning validation and Firebase rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run provisioning input tests and Firestore/Storage emulator suite
        run: npx firebase-tools emulators:exec --only firestore,storage --project demo-metra-it-assets "npm test"
